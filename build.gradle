plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.21'
    id 'com.gradleup.shadow' version '9.4.3'
}

version = '1.8.2'

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven {
        url = 'https://jitpack.io'
    }
    // Optional integrations (all compileOnly; each is only touched when its plugin is installed)
    maven { url = 'https://repo.viaversion.com' }
    maven { url = 'https://repo.opencollab.dev/main/' }
    maven { url = 'https://repo.bluecolored.de/releases' }
    maven { url = 'https://repo.glaremasters.me/repository/towny/' }
    maven { url = 'https://nexus.neetgames.com/repository/maven-releases/' }
    maven { url = 'https://repo.codemc.io/repository/maven-public/' }
    maven { url = 'https://repo.playeranalytics.net/releases' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.72-stable'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly('com.github.MilkBowl:VaultAPI:1.7') {
        exclude group: 'org.bukkit'
    }
    compileOnly('com.viaversion:viaversion-api:5.12.0') { transitive = false }
    compileOnly('org.geysermc.floodgate:api:2.2.5-SNAPSHOT') { transitive = false }
    compileOnly('org.geysermc.cumulus:cumulus:2.0.0-SNAPSHOT') { transitive = false }
    compileOnly('de.bluecolored:bluemap-api:2.8.1') { transitive = false }
    compileOnly('xyz.jpenilla:squaremap-api:1.4.0') { transitive = false }
    compileOnly('com.palmergames.bukkit.towny:towny:0.98.4.10') { transitive = false }
    compileOnly('com.github.angeschossen:LandsAPI:7.25.4') { transitive = false }
    compileOnly('net.luckperms:api:5.5')
    compileOnly('com.gmail.nossr50.mcMMO:mcMMO:2.3.002') { transitive = false }
    compileOnly('com.ghostchu:quickshop-api:6.3.0.0') { transitive = false }
    compileOnly('com.djrapitops:plan-api:5.9-R0.1') { transitive = false }
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.3.21'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'org.bstats:bstats-bukkit:3.1.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:2.3.21'
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.35.0'
    testImplementation 'net.kyori:adventure-text-minimessage:4.20.0'
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(26))
    }
    withSourcesJar()
}

kotlin {
    jvmToolchain(26)
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

shadowJar {
    archiveBaseName = 'Chronicler'
    archiveVersion = project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    relocate 'org.bstats', 'uk.ewancroft.chronicler.libs.bstats'
    exclude 'org/bukkit/**', 'io/papermc/**', 'net/kyori/**'
    exclude 'META-INF/versions/**', 'META-INF/libraries/**'
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

// Keep both plugin descriptors in step with the Gradle version.
processResources {
    inputs.property 'version', project.version
    filesMatching(['plugin.yml', 'paper-plugin.yml']) {
        expand(version: project.version)
    }
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
}

build.dependsOn shadowJar

tasks.register('releaseChecksum') {
    dependsOn shadowJar
    doLast {
        ant.checksum(
            file: tasks.shadowJar.archiveFile.get().asFile,
            algorithm: 'SHA-256',
            fileext: '.sha256',
        )
    }
}

build.dependsOn releaseChecksum

clean {
    delete 'build'
}
