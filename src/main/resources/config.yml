# Chronicler configuration
config-version: 3

# Master toggle.
enabled: true

# How often to publish a new newspaper.
# Options: DAILY, WEEKLY, BIWEEKLY, MONTHLY
# Or a custom interval in ticks (20 ticks = 1 second).
schedule: WEEKLY

# Time base for publication scheduling.
# REAL_TIME uses server time. IN_GAME uses Minecraft time and ticks.
schedule-base: REAL_TIME

# Day of week / time for publication (used for REAL_TIME WEEKLY/BIWEEKLY/MONTHLY).
# 0 = Monday, 6 = Sunday. Hour in 0-23 server time.
publish-day: 0
publish-hour: 8

# Which event categories to track.
tracking:
  deaths: true
  kills: true
  pvp: true
  advancements: true
  blocks: true
  exploration: true
  social: true
  economy: true
  chat: true
  crafting: true
  fishing: true
  sleep: true
  portals: true
  entities: true
  explosions: true
  weather: true
  raids: true
  teleport: true
  consumption: true
  projectiles: true
  vehicles: true
  misc: true

# Maximum events stored per category before older ones are pruned.
event-limit: 500

# bStats metrics (anonymous usage statistics).
bstats-enabled: true

# Automatically download newer GitHub releases.
# Updates are installed safely on the next full server restart.
auto-update:
  enabled: true

# LLM configuration for article generation.
# If disabled, falls back to template-based summaries.
# Providers: ollama, openai (works with OpenRouter, OpenAI, any OpenAI-compatible API), anthropic
llm:
  enabled: true
  provider: ollama
  model: llama3.2
  # API key for providers that require it (openai, anthropic).
  # Get one from https://openrouter.ai/keys for OpenRouter.
  api-key: ""
  # Base URL for OpenAI-compatible providers (OpenRouter, OpenAI, etc.).
  base-url: https://openrouter.ai/api/v1
  # Base URL for Ollama (only used when provider is ollama).
  ollama-url: http://localhost:11434
  timeout-seconds: 30
  # System prompt for the LLM (controls tone and style).
  # Available variables: {series_title}, {server_name}, {tone}, {maxArticleCharacters}
  system-prompt: >
    You are the editor of "{series_title}", a newspaper chronicling life on
    the {server_name} Minecraft server. Write accurate, concise, and vivid
    news articles based solely on the event data provided. The tone is {tone}
    — NEVER invent facts, quotes, or details not present in the event data.

    Each article must follow an inverted-pyramid structure: open with a strong
    lead covering the most important who, what, and outcome, then support with
    specific facts and context drawn from the events.

    Articles must be at most {maxArticleCharacters} characters. Format exactly:

    ---HEADLINE
    (concise news headline, max 60 characters)
    ---BODY
    (2-4 complete sentences, third person, no markdown or bullet points)

# Newspaper settings.
newspaper:
  # Title prefix for each issue (issue number appended).
  title: "The Weekly Chronicle"
  # Author name on the book.
  author: "Chronicler"
  # Server name used for {server_name} in the LLM system prompt.
  # Leave blank to refer to "this server".
  server-name: ""
  # Language for dates on printed pages and books (e.g. en-GB, en-US, de-DE).
  # The in-game reader shows dates in each player's own client language.
  locale: "en-GB"
  # Print players' skin faces as photographs on the typeset pages.
  # auto: only on online-mode servers (offline-mode names may belong to
  # someone else's Mojang account). true / false to force.
  portraits: auto
  # Max stories per section (only used when LLM is disabled).
  stories-per-section: 5
  # Include raw statistics page.
  show-statistics: true
  # Default reporter credit and LLM editorial style.
  byline: "Chronicler Staff"
  tone: "dry, factual, and slightly humorous"
  # Long copy is split cleanly across consecutive book pages.
  max-article-characters: 900
  # Optional exact section ordering; omitted sections follow afterwards.
  section-order: []
  title-page-text: "A chronicle of events past."
  colors:
    accent: "#6B3E00"
    primary: "#1F1A14"
    secondary: "#3D342A"
    muted: "#5C4F40"

# Hold generated issues as drafts until an administrator publishes them.
editor:
  review-required: false

# Letters to the editor, classified adverts and the reader poll.
contributions:
  enabled: true
  # Staff approve submissions with /chronicler submissions before they print.
  require-approval: true
  # How many unreviewed submissions one player may have waiting.
  max-pending-per-player: 2

archive:
  # Oldest issues beyond this count are removed after publication.
  retention: 50

# Backfill issue #0 from server logs on first run.
# Parses logs/latest.log and rotated logs/*.log.gz for historical
# joins, deaths, advancements, and chat before the plugin was installed.
backfill:
  enabled: true
  # Maximum rotated log files to parse (1 file ≈ 1 server session).
  max-log-files: 100

privacy:
  include-private-messages: false
  # When false, chat text is never written to events.json (chat is still
  # counted); sign text is kept but left out of issues. Death messages and
  # other server text are unaffected.
  include-chat-excerpts: false
  include-coordinates: false
  excluded-players: []

# Headline ticker — periodically broadcasts a headline from the current issue.
ticker:
  # Interval in ticks (20 ticks = 1 second). Set to 0 to disable.
  interval-ticks: 1200
  # Enable PlaceholderAPI expansion (%chronicler_*%).
  papi-enabled: true

# Web output.
web:
  enabled: true
  # Port for the embedded web server (0 to disable serving, just write files).
  port: 8080
  # Write HTML to plugin folder even when serving.
  write-files: true
  # The address people reach this web server on, e.g. "http://play.example.com:8080".
  # Used for the resource pack download, printed page images and links in
  # Discord / Standard.site posts. Blank uses server-ip from server.properties.
  public-url: ""

# How players read an issue in-game.
reader:
  # newspaper: a typeset broadsheet page shown in a reader screen (uses the
  #            resource pack below; players without it get a text edition).
  # book:      the classic written book.
  mode: newspaper
  # On-screen page width in GUI pixels (256-512). 336 suits GUI scale 3 at 1080p.
  page-width: 336
  resource-pack:
    # Serve Chronicler's resource pack (newspaper item art and printed pages)
    # from the web server above, and offer it to players on join.
    enabled: true
    # Downloaded from web.public-url; if that and server-ip are both blank the
    # pack is only written to plugins/Chronicler/web/chronicler-pack.zip.
    # Kick players who decline the pack.
    required: false
    # Shown on the download prompt (MiniMessage). Blank uses the default.
    prompt: ""
